<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GRINNERS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#120a1b; --plum:#1d1229; --plum-2:#2a1b3b; --edge:#46305f; --edge-hi:#6b4d8f;
  --bone:#efe2c2; --muted:#b4a3c6; --dim:#7c6a91;
  --lantern:#ffcf4a; --lantern-ink:#2b1a00; --violet:#a35cff; --danger:#ff6161; --good:#86f0a2;
  --font-ui:'Fredoka','Trebuchet MS','Segoe UI',system-ui,sans-serif;
  --font-display:'Creepster','Impact','Arial Black',system-ui,sans-serif;
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#120a1b; --bone:#efe2c2; --plum:#1d1229; } }
:root[data-theme="dark"]{ --bg:#120a1b; --bone:#efe2c2; --plum:#1d1229; }
*,*::before,*::after{ box-sizing:inherit; }
html{ height:100%; scroll-padding-top:env(safe-area-inset-top,0px); }
body{ margin:0; height:100%; background:var(--bg); color:var(--bone); font-family:var(--font-ui); overflow:hidden;
  -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
#stage{ position:fixed; left:0; right:0; top:env(safe-area-inset-top,0px); bottom:env(safe-area-inset-bottom,0px); }
#game{ display:block; width:100%; height:100%; touch-action:none; background:var(--bg); }
#game.playing{ cursor:none; }
#ui{ position:absolute; inset:0; pointer-events:none; display:flex; align-items:center; justify-content:center; padding:18px; }
.screen{ pointer-events:auto; max-width:min(980px,100%); max-height:100%; overflow:auto; scrollbar-width:thin; }
.panel{ background:rgba(23,14,34,.94); border:2px solid var(--edge); border-radius:22px; padding:24px 28px; box-shadow:0 18px 60px rgba(0,0,0,.55); }
h1,h2,h3{ margin:0; font-weight:600; }
h2{ font-size:30px; color:var(--bone); margin-bottom:6px; }
h3{ font-size:19px; color:var(--lantern); margin:18px 0 8px; }
p{ margin:6px 0; line-height:1.45; color:var(--muted); max-width:62ch; }
.logo{ font-family:var(--font-display); font-size:clamp(64px,11vw,132px); line-height:.85; color:var(--bone); letter-spacing:2px;
  text-shadow:0 0 18px rgba(163,92,255,.55), 0 6px 0 #3a1d55; }
.tag{ font-size:clamp(17px,2.2vw,22px); color:var(--lantern); margin:10px 0 22px 4px; }
.title{ align-self:center; margin-right:auto; margin-left:clamp(0px,5vw,70px); display:flex; flex-direction:column; }
.menu{ display:flex; flex-direction:column; gap:10px; width:min(330px,80vw); }
button{ font-family:var(--font-ui); font-size:19px; font-weight:600; color:var(--bone); background:var(--plum-2); border:2px solid var(--edge);
  border-radius:16px; padding:12px 18px; cursor:pointer; text-align:left; display:flex; align-items:center; justify-content:space-between; gap:12px; }
button:hover{ border-color:var(--edge-hi); background:#352349; }
button:focus-visible{ outline:3px solid var(--lantern); outline-offset:2px; }
button.primary{ background:var(--lantern); color:var(--lantern-ink); border-color:#ffe28a; font-size:22px; }
button.primary:hover{ background:#ffdb72; }
button:disabled{ opacity:.45; cursor:not-allowed; }
button.small{ font-size:16px; padding:8px 14px; border-radius:12px; }
.row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.row.end{ justify-content:flex-end; margin-top:18px; }
.foot{ margin-top:16px; color:var(--dim); font-size:15px; }
.coin{ display:inline-block; width:15px; height:15px; border-radius:50%; background:#efe2c2; border:2px solid #6b5a3c; vertical-align:-2px;
  box-shadow:inset 3px -3px 0 rgba(0,0,0,.12); position:relative; }
.coin::after{ content:''; position:absolute; left:3px; top:3px; width:5px; height:5px; border-radius:50%; background:transparent;
  box-shadow:0 0 0 1px #6b5a3c; }
.cards{ display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:12px; margin-top:12px; }
.card{ background:var(--plum); border:2px solid var(--edge); border-radius:16px; padding:14px; display:flex; flex-direction:column; gap:6px; }
.card.locked{ opacity:.5; }
.card .name{ font-size:19px; font-weight:600; color:var(--bone); }
.card .sub{ font-size:14px; color:var(--muted); line-height:1.35; }
.swatch{ height:46px; border-radius:10px; border:2px solid rgba(255,255,255,.08); }
.badge{ font-size:13px; padding:2px 9px; border-radius:99px; background:#2f2244; color:var(--muted); align-self:flex-start; }
.badge.done{ background:#1f3d2c; color:var(--good); }
.pips{ letter-spacing:3px; color:var(--lantern); font-size:18px; }
.keys{ display:grid; grid-template-columns:auto 1fr; gap:8px 16px; align-items:center; margin-top:10px; }
.kbd{ display:inline-block; min-width:34px; text-align:center; padding:4px 9px; border-radius:9px; background:#efe2c2; color:#241a0c;
  font-weight:700; font-size:15px; box-shadow:0 3px 0 #9d8c66; margin-right:4px; }
.setting{ display:flex; justify-content:space-between; align-items:center; gap:16px; padding:9px 0; border-bottom:1px solid #2c1f3d; }
.setting label{ font-size:17px; }
.seg{ display:flex; gap:6px; }
.seg button{ padding:7px 13px; font-size:16px; }
.seg button.on{ background:var(--lantern); color:var(--lantern-ink); border-color:#ffe28a; }
input[type=range]{ width:170px; accent-color:var(--lantern); }
input[type=checkbox]{ width:24px; height:24px; accent-color:var(--lantern); }
input[type=text]{ font-family:var(--font-ui); font-size:20px; padding:9px 12px; border-radius:12px; border:2px solid var(--edge); background:#0f0917;
  color:var(--bone); width:220px; }
.split{ display:grid; grid-template-columns:minmax(220px,300px) 1fr; gap:24px; }
@media (max-width:720px){ .split{ grid-template-columns:1fr; } .title{ margin:0 auto; align-items:center; } }
.skins{ display:flex; gap:8px; margin-top:6px; }
.skins button{ width:38px; height:38px; padding:0; border-radius:50%; }
.skins button.on{ outline:3px solid var(--lantern); outline-offset:2px; }
canvas.prev{ width:100%; border-radius:16px; background:radial-gradient(circle at 50% 70%, #3a2a1c 0%, #160e20 70%); display:block; }
.beast{ display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px; margin-top:8px; }
.beast .card{ padding:8px; } .beast canvas{ width:100%; height:120px; border-radius:10px; background:#0d0814; }
.big{ font-size:44px; font-weight:700; color:var(--lantern); line-height:1; }
.stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin:14px 0; }
.stat{ background:var(--plum); border-radius:14px; padding:12px; } .stat b{ display:block; font-size:26px; color:var(--bone); } .stat span{ color:var(--muted); font-size:14px; }
/* dialogue */
.dialog{ align-self:flex-end; width:min(860px,100%); display:flex; gap:16px; align-items:stretch; margin-bottom:8px; }
.dialog canvas{ width:120px; height:120px; border-radius:16px; background:#0e0816; border:2px solid var(--edge); flex:none; }
.dialog .who{ color:var(--lantern); font-weight:600; font-size:18px; }
.dialog .text{ font-size:21px; line-height:1.45; color:var(--bone); min-height:62px; }
.dialog .hint{ color:var(--dim); font-size:14px; margin-top:6px; }
.dialog .panel{ flex:1; position:relative; padding:16px 20px; }
.skip{ position:absolute; top:10px; right:12px; }
.mission{ text-align:center; } .mission .num{ color:var(--violet); font-size:18px; font-weight:600; }
.mission h1{ font-family:var(--font-display); font-size:clamp(46px,8vw,84px); font-weight:400; color:var(--bone); line-height:1; margin:6px 0 10px; letter-spacing:1px; }
.mission .goal{ font-size:22px; color:var(--lantern); }
#toasts{ position:absolute; top:12px; right:12px; display:flex; flex-direction:column; gap:8px; pointer-events:none; z-index:5; }
.toast{ background:rgba(23,14,34,.96); border:2px solid var(--lantern); border-radius:14px; padding:10px 14px; min-width:230px; animation:tin .35s ease-out; }
.toast b{ color:var(--lantern); display:block; } .toast span{ color:var(--muted); font-size:14px; }
@keyframes tin{ from{ transform:translateX(30px); opacity:0; } to{ transform:none; opacity:1; } }
@media (prefers-reduced-motion: reduce){ .toast{ animation:none; } }
.center{ text-align:center; } .center .row{ justify-content:center; }

button span{ font-weight:500; font-size:15px; color:inherit; opacity:.72; display:inline-flex; align-items:center; gap:6px; }
button.card{ align-items:stretch; justify-content:flex-start; text-align:left; font-size:inherit; padding:14px; }
button.card span{ opacity:1; }
.sb{ display:block; height:8px; border-radius:4px; background:#2f2244; overflow:hidden; } .sb i{ display:block; height:100%; background:var(--lantern); }
label{ font-size:17px; color:var(--muted); }
.title .menu{ gap:8px; } .title button{ padding:10px 18px; }
.mission h1{ text-shadow:0 0 18px rgba(163,92,255,.55), 0 5px 0 #3a1d55; }
html, body{ overscroll-behavior:none; touch-action:manipulation; -webkit-touch-callout:none; }
#stage{ left:env(safe-area-inset-left,0px); right:env(safe-area-inset-right,0px); }
.panel .menu{ width:100%; }
@media (max-height:560px){
  #ui{ padding:8px 12px; }
  .logo{ font-size:clamp(40px,14vh,96px); }
  .tag{ font-size:16px; margin:4px 0 10px 2px; }
  .menu{ display:grid; grid-template-columns:1fr 1fr; gap:6px; width:min(460px,58vw); }
  .menu button.primary{ grid-column:1 / -1; }
  .menu button{ padding:8px 12px; font-size:16px; border-radius:13px; }
  .menu button.primary{ font-size:18px; }
  .panel{ padding:14px 16px; border-radius:16px; }
  h2{ font-size:24px; } h3{ margin:12px 0 6px; }
  .dialog canvas{ width:84px; height:84px; }
  .dialog .panel{ padding:12px 16px; } .dialog .text{ font-size:17px; min-height:0; }
  .mission h1{ font-size:clamp(38px,15vh,72px); } .mission .goal{ font-size:18px; }
  canvas.prev{ height:190px !important; }
  .stats{ margin:8px 0; gap:8px; } .stat{ padding:8px 10px; } .stat b{ font-size:20px; }
  .card{ padding:10px; }
  .toast{ min-width:0; padding:6px 10px; } .toast span{ display:none; }
}
@media (max-width:600px){
  #ui{ padding:10px; }
  .title{ margin:0 auto; width:100%; align-items:center; }
  .logo{ font-size:clamp(48px,20vw,96px); text-align:center; }
  .tag{ text-align:center; font-size:16px; }
  .menu{ display:grid; grid-template-columns:1fr 1fr; gap:8px; width:100%; }
  .menu button.primary{ grid-column:1 / -1; }
  .menu button{ padding:10px 12px; font-size:16px; }
  .panel{ padding:16px; } h2{ font-size:24px; }
  .dialog{ gap:10px; } .dialog canvas{ width:72px; height:72px; } .dialog .text{ font-size:17px; }
  .keys{ gap:6px 10px; }
  #toasts{ left:10px; right:10px; align-items:center; } .toast{ min-width:0; width:100%; }
}
</style>
</head>
<body>
<div id="stage"><canvas id="game"></canvas><div id="ui"></div><div id="toasts"></div></div>
<script>
'use strict';
/* ================= GRINNERS — core ================= */
const TAU = Math.PI * 2, TILE = 48, AIMZ = 38, BZ = 44;
const rand = (a = 1, b) => (b === undefined ? Math.random() * a : a + Math.random() * (b - a));
const randi = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (a, b, k, dt) => a + (b - a) * (1 - Math.exp(-k * dt));
const dist2 = (ax, ay, bx, by) => (bx - ax) * (bx - ax) + (by - ay) * (by - ay);
const dist = (ax, ay, bx, by) => Math.sqrt(dist2(ax, ay, bx, by));
const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
const fmtTime = s => { s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const fmtNum = n => Math.round(n).toLocaleString('en-US');
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function mulberry(seed) { return () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; }
let G = null; // the running game, null in menus

/* ---------- save data ---------- */
const DEFAULT_SAVE = {
  v: 1, name: 'Buttons', skin: 1, seenHowTo: false, unlocked: 1, done: [false, false, false, false, false],
  weapons: ['pistol'], coins: 0, up: { hp: 0, dmg: 0, reload: 0, ammo: 0 },
  best: { score: 0, wave: 0 }, stats: { kills: 0, bosses: 0, dodges: 0, coins: 0 }, ach: {},
  settings: { difficulty: 'easy', master: 0.8, music: 0.5, sfx: 0.8, shake: true, aimAssist: true, autoReload: true, dmgNumbers: true, brightness: 0.6, minimap: true, lowFx: false, hints: true, autoShoot: true }
};
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function mergeDefaults(def, obj) {
  if (Array.isArray(def)) return Array.isArray(obj) ? obj : def;
  if (def && typeof def === 'object') {
    const out = Object.assign({}, def);
    if (obj && typeof obj === 'object' && !Array.isArray(obj)) for (const k in obj) out[k] = k in def ? mergeDefaults(def[k], obj[k]) : obj[k];
    return out;
  }
  return typeof obj === typeof def ? obj : def;
}
const SAVE_KEY = 'grinners-save-v1';
let SAVE = (() => { try { const raw = localStorage.getItem(SAVE_KEY); if (raw) return mergeDefaults(clone(DEFAULT_SAVE), JSON.parse(raw)); } catch (e) { /* storage unavailable */ } return clone(DEFAULT_SAVE); })();
let S = SAVE.settings;
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); } catch (e) { /* ignore */ } }

const DIFF = {
  easy:   { label: 'Easy',   php: 1.5, edmg: 0.5, ehp: 0.8,  espd: 0.85, bspd: 0.72, melee: 2, ranged: 1, rof: 0.6,  dodge: 0.12, react: 1.35, drops: 1.5, score: 1 },
  normal: { label: 'Normal', php: 1.0, edmg: 1.0, ehp: 1.0,  espd: 1.0,  bspd: 1.0,  melee: 4, ranged: 2, rof: 1.0,  dodge: 0.3,  react: 1.0,  drops: 1.0, score: 1.5 },
  hard:   { label: 'Hard',   php: 0.8, edmg: 1.4, ehp: 1.3,  espd: 1.12, bspd: 1.2,  melee: 6, ranged: 3, rof: 1.35, dodge: 0.55, react: 0.78, drops: 0.8, score: 2 },
};
const D = () => DIFF[S.difficulty] || DIFF.easy;

/* ---------- audio: everything is synthesized, no files ---------- */
const AUD = (() => {
  let ac = null, master, sfx, mus, amb, noiseBuf, ok = false, ambNode = null, ambTimer = 0, ambKind = '';
  const lastT = {};
  const THR = { hit: 45, wallHit: 45, step: 70, coin: 35, giggle: 380, growl: 600, spit: 70, orb: 70, speaker: 280, rifle: 55, light: 55, pop: 50, hover: 60, hurt: 120, crate: 60 };
  const M = { on: false, step: 0, next: 0, tempo: 84, key: 0, inten: 0 };
  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    try {
      ac = new AC();
      const comp = ac.createDynamicsCompressor(); comp.threshold.value = -12; comp.ratio.value = 5;
      master = ac.createGain(); sfx = ac.createGain(); mus = ac.createGain(); amb = ac.createGain();
      sfx.connect(master); mus.connect(master); amb.connect(master); master.connect(comp); comp.connect(ac.destination);
      noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      ok = true; volumes();
    } catch (e) { ac = null; ok = false; }
  }
  function volumes() { if (!ok) return; master.gain.value = S.master; sfx.gain.value = S.sfx; mus.gain.value = S.music * 0.55; amb.gain.value = S.sfx * 0.4; }
  function out(bus, pan, vol) {
    const g = ac.createGain(); g.gain.value = vol;
    if (pan && ac.createStereoPanner) { const p = ac.createStereoPanner(); p.pan.value = clamp(pan, -1, 1); g.connect(p); p.connect(bus); } else g.connect(bus);
    return g;
  }
  function tone(o) {
    const t = (o.t || 0) + ac.currentTime, dur = o.dur || 0.2;
    const osc = ac.createOscillator(); osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.f, t); if (o.f2) osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.f2), t + dur);
    const g = ac.createGain(), a = o.a || 0.005;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(o.vol || 0.2, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    let n = osc;
    if (o.lp) { const f = ac.createBiquadFilter(); f.type = o.ft || 'lowpass'; f.frequency.value = o.lp; f.Q.value = o.q || 0.7; n.connect(f); n = f; }
    n.connect(g); g.connect(o.dest || sfx);
    if (o.vib) { const l = ac.createOscillator(), lg = ac.createGain(); l.frequency.value = o.vib; lg.gain.value = o.va || 8; l.connect(lg); lg.connect(osc.frequency); l.start(t); l.stop(t + dur + 0.05); }
    osc.start(t); osc.stop(t + dur + 0.05);
  }
  function noise(o) {
    const t = (o.t || 0) + ac.currentTime, dur = o.dur || 0.2;
    const src = ac.createBufferSource(); src.buffer = noiseBuf;
    const f = ac.createBiquadFilter(); f.type = o.ft || 'lowpass'; f.frequency.setValueAtTime(o.f || 2000, t); if (o.f2) f.frequency.exponentialRampToValueAtTime(o.f2, t + dur); f.Q.value = o.q || 0.8;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(o.vol || 0.3, t + (o.a || 0.002)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(o.dest || sfx);
    src.start(t, Math.random() * Math.max(0, 1.9 - dur)); src.stop(t + dur + 0.05);
  }
  const SFX = {
    pistol: d => { noise({ dest: d, dur: 0.12, vol: 0.45, ft: 'highpass', f: 900 }); tone({ dest: d, type: 'square', f: 220, f2: 70, dur: 0.1, vol: 0.22 }); },
    rifle: d => { noise({ dest: d, dur: 0.08, vol: 0.36, ft: 'bandpass', f: 1800, q: 0.6 }); tone({ dest: d, type: 'triangle', f: 160, f2: 60, dur: 0.08, vol: 0.3 }); },
    shotgun: d => { noise({ dest: d, dur: 0.35, vol: 0.6, f: 3000, f2: 300 }); tone({ dest: d, f: 110, f2: 40, dur: 0.25, vol: 0.5 }); },
    sniper: d => { noise({ dest: d, dur: 0.5, vol: 0.55, ft: 'highpass', f: 400, f2: 150 }); tone({ dest: d, type: 'sawtooth', f: 300, f2: 50, dur: 0.3, vol: 0.3, lp: 1200 }); },
    grenade: d => { tone({ dest: d, f: 180, f2: 60, dur: 0.18, vol: 0.5 }); noise({ dest: d, dur: 0.12, vol: 0.2, f: 900 }); },
    light: d => { tone({ dest: d, type: 'square', f: 1400, f2: 500, dur: 0.12, vol: 0.1, lp: 3000 }); tone({ dest: d, f: 2200, f2: 900, dur: 0.1, vol: 0.08 }); },
    empty: d => noise({ dest: d, dur: 0.04, vol: 0.25, ft: 'bandpass', f: 3000, q: 4 }),
    reload: d => { noise({ dest: d, dur: 0.05, vol: 0.3, ft: 'bandpass', f: 2500, q: 3 }); noise({ dest: d, t: 0.13, dur: 0.05, vol: 0.25, ft: 'bandpass', f: 1500, q: 3 }); },
    reloadDone: d => { noise({ dest: d, dur: 0.06, vol: 0.35, ft: 'bandpass', f: 2000, q: 2 }); tone({ dest: d, type: 'square', f: 900, dur: 0.04, vol: 0.05 }); },
    swap: d => { noise({ dest: d, dur: 0.07, vol: 0.25, ft: 'bandpass', f: 1200, q: 2 }); tone({ dest: d, t: 0.08, type: 'triangle', f: 700, dur: 0.05, vol: 0.1 }); },
    hit: d => { noise({ dest: d, dur: 0.07, vol: 0.32, f: 1200 }); tone({ dest: d, f: rand(240, 330), f2: 120, dur: 0.08, vol: 0.22 }); },
